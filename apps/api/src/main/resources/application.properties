spring.application.name=api
server.port=${PORT:8081}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:neetaspirants}?createDatabaseIfNotExist=false
spring.datasource.username=${DB_USER:neetaspirants_app}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-this-is-not-secure-32bytes}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:15}

app.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRATION_DAYS:30}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

app.embeddings.url=${EMBEDDINGS_URL:http://localhost:8002}
app.qdrant.url=${QDRANT_URL:http://localhost:6333}
app.qdrant.collection=posts

app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.admin.bootstrap-email=${ADMIN_EMAIL:}
