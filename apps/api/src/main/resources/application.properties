spring.application.name=api
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/neetaspirants?createDatabaseIfNotExist=false
spring.datasource.username=${DB_USER:neetaspirants_app}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-this-is-not-secure-32bytes}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:10080}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

app.embeddings.url=${EMBEDDINGS_URL:http://localhost:8002}
app.qdrant.url=${QDRANT_URL:http://localhost:6333}
app.qdrant.collection=posts

app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
